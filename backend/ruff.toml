# Ruff linter configuration for APEX Backend
# Replaces Black + isort + Flake8 for faster linting

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "B904",   # raise ... from err (not used in this codebase)
    "UP007",  # use X | Y for union types (keep Optional for compatibility)
    "SIM105", # contextlib.suppress (try-except-pass is clearer)
    "SIM103", # return condition directly (explicit if/else is clearer)
    "SIM113", # enumerate for loop counter (not always applicable)
    "RUF012", # mutable class variable (Pydantic models handle this)
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"tests/**" = ["B011", "SIM", "E402"]  # allow assert False in tests, allow late imports
"scripts/**" = ["B"]          # relax bugbear in scripts

[format]
quote-style = "double"
indent-style = "space"
